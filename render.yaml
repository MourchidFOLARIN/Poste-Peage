services:
  # ─────────────────────────────────────────
  # 1. SERVICE BACKEND API (Node.js/Express)
  # ─────────────────────────────────────────
  - type: web
    name: peage-backend
    env: node
    region: frankfurt
    plan: free

    # Build : générer Prisma Client
    buildCommand: npx prisma generate

    # Démarrage de l'API Express
    startCommand: npm start

    # Variables d'environnement injectées ou configurées sur le Dashboard Render
    envVars:
      - key: DATABASE_URL
        sync: false # Utilise l'URL de connexion de la base créee manuellement sur Render
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # ──────────────────────────────────────────
  # 2. SERVICE FRONTEND (React / Vite — Static)
  # ──────────────────────────────────────────
  - type: web
    name: peage-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build
    staticPublishPath: frontend/dist
    # Redirige toutes les routes vers index.html (React Router SPA)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://peage-backend.onrender.com

