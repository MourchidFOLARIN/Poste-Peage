services:
  # ─────────────────────────────────────────
  # 1. SERVICE BACKEND API (Node.js/Express)
  # ─────────────────────────────────────────
  - type: web
    name: peage-backend
    env: node
    region: frankfurt
    plan: free

    # Build : installer les dépendances + générer Prisma Client
    buildCommand: npm run build

    # Sync de la base de données PostgreSQL avant le déploiement en direct
    preDeployCommand: npx prisma db push --accept-data-loss

    # Démarrage de l'API Express
    startCommand: npm start

    # Variables d'environnement injectées automatiquement
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peage-postgres-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # ──────────────────────────────────────────
  # 2. SERVICE FRONTEND (React / Vite — Static)
  # ──────────────────────────────────────────
  - type: web
    name: peage-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    # Redirige toutes les routes vers index.html (React Router SPA)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://peage-backend.onrender.com

# ─────────────────────────────────────────────
# 3. BASE DE DONNÉES PostgreSQL (Managée Render)
# ─────────────────────────────────────────────
databases:
  - name: peage-postgres-db
    databaseName: peage_db
    user: peage_user
    region: frankfurt
    plan: free
